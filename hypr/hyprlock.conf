general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(d79921ff)
    inner_color = rgba(1d2021ff)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb2">Password...</span>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
