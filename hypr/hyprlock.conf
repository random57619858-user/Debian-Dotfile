general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    blur_passes = 4
    blur_size = 10
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ebdbb2ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(1d2021aa)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(d79921ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(1d2021aa)
}

label {
    monitor =
    text = $USER
    color = rgba(8ec07cff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(d79921ff)
    inner_color = rgba(1d2021ff)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = false
    rounding = 10
    check_color = rgba(8ec07cff)
    fail_color = rgba(cc241dff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(d65d0eff)
    placeholder_text = <span foreground="##928374">Enter your password...</span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(1d2021aa)
}

label {
    monitor =
    text = <span foreground="##928374">Press enter for unlock</span>
    color = rgba(928374ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
